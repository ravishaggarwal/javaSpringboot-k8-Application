server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: app-k8-deployment-health

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

app:
  version: ${APP_VERSION:1.0.0}
  environment: ${APP_ENVIRONMENT:local}
  message: ${APP_MESSAGE:application is healthy}
